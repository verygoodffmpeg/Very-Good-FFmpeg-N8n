# Local n8n with this package mounted as a custom node.
# Run `pnpm build` first so dist/ exists, then `docker compose up`.
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    ports:
      - '5678:5678'
    environment:
      - N8N_SECURE_COOKIE=false
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - N8N_VERSION_NOTIFICATIONS_ENABLED=false
      - N8N_RUNNERS_ENABLED=true
    volumes:
      - n8n_data:/home/node/.n8n
      - ./package.json:/home/node/.n8n/custom/node_modules/n8n-nodes-verygoodffmpeg/package.json:ro
      - ./dist:/home/node/.n8n/custom/node_modules/n8n-nodes-verygoodffmpeg/dist:ro

volumes:
  n8n_data:
